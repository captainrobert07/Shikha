<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shikha Murali">
  <defs>
    <linearGradient id="sm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#2A6CF6"/>
      <stop offset="55%" stop-color="#6FB1FF"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
    <linearGradient id="sm-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1854D4"/>
      <stop offset="100%" stop-color="#8B7BFF"/>
    </linearGradient>
  </defs>
  <!-- Soft tile background -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="#0B1A33"/>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#sm-grad)" opacity="0.18"/>
  <!-- Inner glow ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="none" stroke="url(#sm-grad)" stroke-width="0.8" opacity="0.55"/>
  <!-- Monogram: S and M overlapping -->
  <!-- S shape (left) -->
  <path d="M22 18
           C 28 16, 36 16, 38 21
           C 38 26, 30 27, 26 30
           C 22 33, 22 39, 26 42
           C 30 46, 38 46, 42 42"
        fill="none" stroke="url(#sm-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- M shape (right side, slightly behind) -->
  <path d="M28 46 L 28 22 L 38 36 L 48 22 L 48 46"
        fill="none" stroke="url(#sm-grad-2)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>
  <!-- Tiny accent dot — Shikha's signature spark -->
  <circle cx="50" cy="14" r="2" fill="#6FE6FF"/>
</svg>
