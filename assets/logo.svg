<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Shikha Murali">
  <defs>
    <!-- Apple-style gradient: deep blue → indigo → violet -->
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <!-- Inner light catch (top edge) -->
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="60%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft drop shadow for the mark -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feOffset dy="8" in="b" result="bo"/>
      <feComponentTransfer in="bo" result="bot"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode in="bot"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle tile (Apple icon corner radius is ~22.37% of side) -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#tile)"/>
  <!-- Top sheen -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#sheen)"/>

  <!-- Single S mark, modern geometric, optical-balanced -->
  <g filter="url(#markShadow)">
    <path d="
        M 712 348
        C 690 280, 612 248, 528 248
        C 432 248, 360 304, 360 388
        C 360 460, 416 496, 504 522
        L 568 540
        C 624 556, 656 580, 656 620
        C 656 668, 612 700, 540 700
        C 460 700, 408 668, 388 612"
      fill="none" stroke="#FFFFFF" stroke-width="76"
      stroke-linecap="round" stroke-linejoin="round"/>
    <!-- accent dot top-right of S, like Shikha's signature spark -->
    <circle cx="744" cy="320" r="22" fill="#FFFFFF"/>
  </g>
</svg>
