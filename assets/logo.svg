<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Shikha Murali">
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="50%" y1="0%" x2="50%" y2="60%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feOffset dy="8" in="b" result="bo"/>
      <feComponentTransfer in="bo" result="bot"><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode in="bot"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle tile (iOS icon corner radius ~22.37%) -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#tile)"/>
  <!-- Top sheen -->
  <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229" fill="url(#sheen)"/>

  <!-- Geometric S: filled shape, two stacked rectangles + a diagonal connector.
       Reads as an architectural / typographic S, not a snake. -->
  <g filter="url(#markShadow)" fill="#FFFFFF">
    <!-- Top horizontal bar -->
    <rect x="296" y="280" width="432" height="104" rx="52" ry="52"/>
    <!-- Bottom horizontal bar -->
    <rect x="296" y="640" width="432" height="104" rx="52" ry="52"/>
    <!-- Middle horizontal (the waist) -->
    <rect x="296" y="460" width="432" height="104" rx="52" ry="52"/>
    <!-- Left vertical (top-left to middle) -->
    <rect x="296" y="280" width="104" height="284" rx="52" ry="52"/>
    <!-- Right vertical (middle to bottom-right) -->
    <rect x="624" y="460" width="104" height="284" rx="52" ry="52"/>
  </g>
</svg>
